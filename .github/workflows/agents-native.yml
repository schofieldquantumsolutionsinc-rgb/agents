name: agents-native

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-native:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify native JLSQ tree is present
        run: |
          test -f native/MANIFEST.sha256
          test -f native/QGENT_DISPATCHER_001_ABI.md
          test -f native/src/qgent-dispatcher-001.qsource
          echo "native tree present"